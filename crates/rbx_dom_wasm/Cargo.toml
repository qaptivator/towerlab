[package]
name = "rbx_dom_wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly wrapper around rbx-dom for parsing and serializing Roblox files"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
rbx_binary = "3.0.1"
rbx_dom_weak = "4.2.0"
rbx_types = { version = "3.1.0", features = ["serde"] }
rbx_xml = "3.0.1"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
