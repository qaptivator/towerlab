ng-tight text-text-primary lowercase select-none">towerlab</span></div><div class="flex items-center gap-space-sm"><a class="w-11 h-11 flex items-center justify-center rounded-xl text-text-dim hover:text-text-primary transition-colors" data-path="settings" href="#"><span class="material-symbols-outlined text-[20px]">tune</span></a><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full px-gutter pt-14 pb-20 bg-surface-container-lowest"><div class="flex flex-col w-full pb-6 space-y-6">
<!-- Quiet, friendly header -->
<section class="flex flex-col space-y-1">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-text-primary">
      Convert place
    </h1>
<p class="font-body-md text-body-md text-text-muted">
      Select a Roblox place or kit to convert.
    </p>
</section>
<!-- Upload tap target -->
<section>
<label class="group relative flex flex-col items-center justify-center w-full min-h-[148px] p-6 rounded-full bg-surface-container-low active:bg-surface-container transition-colors cursor-pointer text-center select-none shadow-sm">
<input accept=".rbxl,.rbxlx,.rbxm" class="sr-only" id="file-uploader" type="file">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary mb-3 group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[26px]">folder_open</span>
</div>
<span class="font-body-md text-body-md text-text-primary font-medium">
        Tap to select .rbxl or .rbxlx
      </span>
<span class="font-body-sm text-body-sm text-text-dim mt-1">
        or drag from files app
      </span>
</label>
</section>
<!-- Staged file card -->
<section class="flex flex-col space-y-2">
<div class="flex items-center justify-between px-1">
<span class="font-body-sm text-body-sm text-text-dim">Ready to convert</span>
<span class="font-body-sm text-body-sm text-primary">1 file staged</span>
</div>
<div class="flex items-center justify-between p-4 rounded-xl bg-surface-raised shadow-md transition-all" id="staged-card">
<div class="flex items-center space-x-3 min-w-0">
<div class="w-11 h-11 shrink-0 rounded-lg bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[24px]">drive_file_rename_outline</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-body-md text-body-md text-text-primary font-medium truncate" id="staged-filename">
            tower_floor_04.rbxl
          </span>
<span class="font-body-sm text-body-sm text-text-dim">
            2.4 MB • Roblox Place
          </span>
</div>
</div>
<button aria-label="Remove or change file" class="w-11 h-11 shrink-0 ml-2 rounded-xl flex items-center justify-center text-text-dim hover:text-text-primary active:bg-surface-container transition-colors" id="clear-file-btn" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</section>
<!-- Target format selection -->
<section class="flex flex-col space-y-3">
<div class="px-1">
<h2 class="font-body-md text-body-md text-text-primary font-medium">
        Target format
      </h2>
</div>
<!-- Radio Options -->
<div aria-label="Target format" class="flex flex-col space-y-2.5" role="radiogroup">
<!-- Option 1: Selected by default -->
<label class="relative flex items-center justify-between min-h-[58px] px-4 py-3.5 rounded-xl bg-surface-raised active:bg-surface-container transition-all cursor-pointer shadow-sm select-none format-option" data-format="towerkit">
<div class="flex items-center space-x-3.5">
<div class="w-5 h-5 rounded-full bg-primary flex items-center justify-center radio-indicator">
<span class="w-2 h-2 rounded-full bg-surface-container-lowest"></span>
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-text-primary font-medium">TowerKit 2.0</span>
<span class="font-body-sm text-body-sm text-text-dim">Modern modular assembly format</span>
</div>
</div>
<span class="material-symbols-outlined text-primary text-[20px] option-check">check</span>
</label>
<!-- Option 2 -->
<label class="relative flex items-center justify-between min-h-[58px] px-4 py-3.5 rounded-xl bg-surface-container-low active:bg-surface-container transition-all cursor-pointer shadow-sm select-none format-option" data-format="rbxm">
<div class="flex items-center space-x-3.5">
<div class="w-5 h-5 rounded-full bg-surface-container-high flex items-center justify-center radio-indicator">
<span class="w-2 h-2 rounded-full bg-transparent"></span>
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-text-primary font-medium">.rbxm Model</span>
<span class="font-body-sm text-body-sm text-text-dim">Standard Roblox binary model file</span>
</div>
</div>
<span class="material-symbols-outlined text-primary text-[20px] option-check hidden">check</span>
</label>
<!-- Option 3 -->
<label class="relative flex items-center justify-between min-h-[58px] px-4 py-3.5 rounded-xl bg-surface-container-low active:bg-surface-container transition-all cursor-pointer shadow-sm select-none format-option" data-format="gltf">
<div class="flex items-center space-x-3.5">
<div class="w-5 h-5 rounded-full bg-surface-container-high flex items-center justify-center radio-indicator">
<span class="w-2 h-2 rounded-full bg-transparent"></span>
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-text-primary font-medium">glTF / GLB</span>
<span class="font-body-sm text-body-sm text-text-dim">3D interchange for external engines</span>
</div>
</div>
<span class="material-symbols-outlined text-primary text-[20px] option-check hidden">check</span>
</label>
</div>
</section>
<!-- Primary Action & Calm Privacy Note -->
<section class="flex flex-col items-center pt-2 space-y-3">
<button class="w-full h-14 rounded-full bg-primary-container text-on-primary-container font-headline-sm text-headline-sm font-semibold flex items-center justify-center space-x-2 active:opacity-90 active:scale-[0.99] transition-all shadow-md select-none" id="convert-btn" type="button">
<span class="material-symbols-outlined text-[22px]">bolt</span>
<span>Convert File</span>
</button>
<!-- Privacy Reassurance note -->
<div class="flex items-center space-x-1.5 py-1 text-text-dim">
<span class="material-symbols-outlined text-[16px]">lock</span>
<p class="font-body-sm text-body-sm">
        Runs 100% locally on your device.
      </p>
</div>
</section>
</div>
<script>
  (function () {
    const options = document.querySelectorAll('.format-option');
    options.forEach(option => {
      option.addEventListener('click', () => {
        options.forEach(opt => {
          opt.classList.remove('bg-surface-raised');
          opt.classList.add('bg-surface-container-low');
          const indicator = opt.querySelector('.radio-indicator');
          const dot = indicator ? indicator.querySelector('span') : null;
          const check = opt.querySelector('.option-check');
          if (indicator) {
            indicator.classList.remove('bg-primary');
            indicator.classList.add('bg-surface-container-high');
          }
          if (dot) {
            dot.classList.remove('bg-surface-container-lowest');
            dot.classList.add('bg-transparent');
          }
          if (check) check.classList.add('hidden');
        });

        option.classList.remove('bg-surface-container-low');
        option.classList.add('bg-surface-raised');
        const activeIndicator = option.querySelector('.radio-indicator');
        const activeDot = activeIndicator ? activeIndicator.querySelector('span') : null;
        const activeCheck = option.querySelector('.option-check');
        if (activeIndicator) {
          activeIndicator.classList.remove('bg-surface-container-high');
          activeIndicator.classList.add('bg-primary');
        }
        if (activeDot) {
          activeDot.classList.remove('bg-transparent');
          activeDot.classList.add('bg-surface-container-lowest');
        }
        if (activeCheck) activeCheck.classList.remove('hidden');
      });
    });

    const fileInput = document.getElementById('file-uploader');
    const filenameEl = document.getElementById('staged-filename');
    const stagedCard = document.getElementById('staged-card');
    const clearBtn = document.getElementById('clear-file-btn');
    const convertBtn = document.getElementById('convert-btn');

    if (fileInput && filenameEl) {
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          filenameEl.textContent = file.name;
          if (stagedCard) {
            stagedCard.classList.remove('opacity-40');
          }
        }
      });
    }

    if (clearBtn && stagedCard) {
      clearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        filenameEl.textContent = "No place selected";
        stagedCard.classList.add('opacity-40');
      });
    }

    if (convertBtn) {
      convertBtn.addEventListener('click', () => {
        const originalText = convertBtn.innerHTML;
        convertBtn.disabled = true;
        convertBtn.innerHTML = `
          <span class="material-symbols-outlined animate-spin text-[22px]">progress_activity</span>
          <span>Converting...</span>
        `;
        setTimeout(() => {
          convertBtn.disabled = false;
          convertBtn.innerHTML = `
            <span class="material-symbols-outlined text-[22px]">check_circle</span>
            <span>Saved to Files</span>
          `;
          setTimeout(() => {
            convertBtn.innerHTML = originalText;
          }, 2400);
        }, 1100);
      });
    }
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/85 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.3)]" data-active-classes="text-primary font-medium"><div class="h-16 px-gutter-desktop flex items-center justify-around"><a aria-current="page" class="flex flex-col items-center justify-center w-20 h-11 gap-space-xs transition-colors text-primary font-medium" data-path="convert" href="#"><span class="material-symbols-outlined text-[22px]">swap_horiz</span><span class="font-body-sm text-body-sm leading-none">Convert</span></a><a class="flex flex-col items-center justify-center w-20 h-11 gap-space-xs text-text-dim hover:text-on-surface transition-colors" data-path="inspect" href="#"><span class="material-symbols-outlined text-[22px]">manage_search</span><span class="font-body-sm text-body-sm leading-none">Inspect</span></a></div></nav>

</body></html>
